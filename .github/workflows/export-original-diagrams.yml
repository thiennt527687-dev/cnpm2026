name: Export original diagrams

on:
  push:
    paths:
      - .github/workflows/export-original-diagrams.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KAN-13 screenflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect original GitHub diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "Figures/Trang-2.drawio.png" "artifact/06_teacher.png"
          cp "Figures/Trang-3.drawio.png" "artifact/07_academic_admin.png"
          cp "Figures/Trang-4.drawio.png" "artifact/08_parent.png"
          cp "Figures/Trang-5.drawio.png" "artifact/09_payment.png"
          cp "Figures/Trang-6.drawio.png" "artifact/10_notification_reporting.png"
          git fetch origin main:refs/remotes/origin/main
          git show refs/remotes/origin/main:screen_flows.pdf > "artifact/screen_flows_first_5.pdf"
          git show refs/remotes/origin/main:latex/Figures/Context_Diagram.pdf > "artifact/Context_Diagram.pdf"
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload original diagrams
        uses: actions/upload-artifact@v4
        with:
          name: original-github-screenflows-context
          path: artifact/
          if-no-files-found: error
          retention-days: 1
